<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Summer's Recipes</h1>
        <div>
            <input type="text" id="searchInput" placeholder="Search this page...">
            <button onclick="findOnPage()">Find</button>
        </div>
    </header>
    <main id="content">
        <section>
            <section class="first" onclick="recipeToggle(this.parentElement)">
                <h3 class="name">Notes</h3>
                <img src="images/notes.jpg" alt="Notes">
            </section>
            <section class="recipe">
                <section class="header">
                    <i onclick="recipeToggle(this.parentElement.parentElement.parentElement)" class="fa-solid fa-x"></i>
                    <h3><a href="https://docs.google.com/document/d/1M7Vhm4YU6G19EAQt9hTKw-E_G4Fe5lZh2HbCsZoDPLo/edit?tab=t.0" target="_blank">Notes</a></h3>
                </section>
                <section class="main">
                    <iframe tabindex="0" class="notes" src="https://docs.google.com/document/d/1M7Vhm4YU6G19EAQt9hTKw-E_G4Fe5lZh2HbCsZoDPLo/edit?tab=t.0" frameborder="0"></iframe>
                </section>
            </section>
        </section>
    </main>
</body>

<script>
    let currentIndex = 0;

    function findOnPage() {
        const term = document.getElementById("searchInput").value.toLowerCase();
        const content = document.getElementById("content");

        content.innerHTML = content.innerHTML.replace(/<mark>|<\/mark>/g, "");

        if (!term) return;

        // ⬇️ This regex avoids matching inside HTML tags
        const regex = new RegExp(`(${term})(?=[^>]*<)`, "gi");

        content.innerHTML = content.innerHTML.replace(regex, "<mark>$1</mark>");

        const matches = content.querySelectorAll("mark");
        if (matches.length) {
            matches[currentIndex % matches.length].scrollIntoView({ behavior: "smooth", block: "center" });
            currentIndex++;
        }
    }
</script>
</html>
